  <g stroke="#ff7da6" stroke-width="12" fill="#ffffff" fill-opacity=".38" filter="url(#b-logic-glow)"><circle cx="220" cy="250" r="62"/><rect x="360" y="184" width="132" height="132" rx="26"/><polygon points="625,170 745,318 505,318"/></g><path d="M282 250 H360M492 250 H565" stroke="#ff7da6" stroke-width="10" opacity=".42"/>
  <rect x="900" y="0" width="600" height="500" fill="url(#b-logic-fade)"/>

