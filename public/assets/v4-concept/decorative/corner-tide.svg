<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" >
<defs>
  <linearGradient id="corner-g" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#2a73ff"/>
    <stop offset="45%" stop-color="#2fd0d8"/>
    <stop offset="100%" stop-color="#7aa8ff"/>
  </linearGradient>
  <radialGradient id="corner-r" cx="50%" cy="45%" r="70%">
    <stop offset="0%" stop-color="#f4f7fb" stop-opacity=".95"/>
    <stop offset="45%" stop-color="#2fd0d8" stop-opacity=".42"/>
    <stop offset="100%" stop-color="#2a73ff" stop-opacity="0"/>
